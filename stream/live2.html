
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Kora Live - مشغل نظيف</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            top: -280px;
            left: 0;
            width: 100%;
            height: 800px;
            border: none;
            z-index: 1;
           
        }

        #mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 2;
            pointer-events:none;
        }

        #mask img {
        margin-block:200px;
            width: 102%;
            height:60%;
            object-fit:;
            z-index:2;
            pointer-events:auto;
        }
        #previewImage1 {pointer-events:none;}
    </style>
</head>
<body>

    <div id="mask">
        <img id="cont"  src="1000085193-01.jpeg" alt="cover">
    </div>
<img id="previewImage1" src="img/loading_gaCZ3O8b.gif" style="position:absolute;top:-30px;left:3px;width:100%;height:272px;z-index:1;opacity:98%;">
    <iframe id="live2"
        scrolling="" 
        allowfullscreen
        allow="fullscreen">
    </iframe>
<script src="Live.js"></script>
<script type="text/javascript">

const cont = document.getElementById("cont");

/* دخول Fullscreen عند النقر على الصورة فقط */
cont.addEventListener("click", function () {
  if (!document.fullscreenElement) {
    cont.style.display = "none";
    document.documentElement.requestFullscreen();
  }
});

/* عند الخروج من Fullscreen (ESC فقط) */
document.addEventListener("fullscreenchange", function () {
  if (!document.fullscreenElement) {
    // خرجنا من الفول سكرين باستخدام ESC
    cont.style.display = "";
    document.body.style.margin = "";
    document.body.style.overflow = "";
  } else {
    // دخلنا الفول سكرين
    document.body.style.margin = "0";
    document.body.style.overflow = "hidden";
  }
});
</script>


</body>
</html>
