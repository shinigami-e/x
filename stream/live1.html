<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Kora Live - مشغل نظيف</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            top: -310px;
            left: -5px;
            width: 110%;
            height: 800px;
            border: none;
            z-index: 1;
            position: fixed;
            overflow: hidden;
        }

        #mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 2;
            pointer-events: none;
        }

        #mask img {
            margin-block: 200px;
            width: 102%;
            height: 60%;
            z-index: 2;
            pointer-events: auto;
        }

        #previewImage1 {
            pointer-events: none;
        }

        /* Click layer فوق iframe */
        #iframeClickLayer {
            position: fixed;
            inset: 0;
            z-index: 5;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="mask">
        <img id="cont" src="1000085193-01.jpeg" alt="cover">
    </div>

    <img id="previewImage1"
        src="img/loading_gaCZ3O8b.gif"
        style="position:absolute;top:-30px;left:3px;width:100%;height:272px;z-index:1;opacity:98%;">

    <iframe id="live1"
        scrolling=""
        allowfullscreen
        allow="fullscreen">
    </iframe>

    <!-- Transparent click area -->
    <div id="iframeClickLayer"></div>

    <script src="Live.js"></script>

    <script type="text/javascript">

    const cont = document.getElementById("cont");

    /* Fullscreen */
    cont.addEventListener("click", function () {
        if (!document.fullscreenElement) {
            cont.style.display = "none";
            document.documentElement.requestFullscreen();
        }
    });

    document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement) {
            cont.style.display = "";
            document.body.style.margin = "";
            document.body.style.overflow = "";
        } else {
            document.body.style.margin = "0";
            document.body.style.overflow = "hidden";
        }
    });

    /* Click iframe = play/stop */
    const iframe = document.getElementById("live1");
    const clickLayer = document.getElementById("iframeClickLayer");

    let originalIframeSrc = "";
    let isPlaying = true;

    // Save src after Live.js loads
    setTimeout(() => {
        originalIframeSrc = iframe.src;
    }, 1000);

    clickLayer.addEventListener("click", () => {

        if (isPlaying) {
            iframe.src = ""; // stop
        } else {
            iframe.src = originalIframeSrc; // play
        }

        isPlaying = !isPlaying;
    });

    </script>

</body>
</html>
