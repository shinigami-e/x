<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Kora Live - مشغل نظيف</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            top: -310px;
            left: -5px;
            width: 110%;
            height: 800px;
            border: none;
            z-index: 1;
            position: fixed;
            overflow: hidden;
        }

        #mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 2;
            pointer-events: none;
        }

        #mask img {
            margin-block: 200px;
            width: 102%;
            height: 60%;
            z-index: 2;
            pointer-events: auto;
        }

        #previewImage1 {
            pointer-events: none;
        }

        /* Transparent center button */
        #videoToggle {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 34px;
            cursor: pointer;
            z-index: 99999;
        }
    </style>
</head>

<body>

    <div id="mask">
        <img id="cont" src="1000085193-01.jpeg" alt="cover">
    </div>

    <img id="previewImage1"
        src="img/loading_gaCZ3O8b.gif"
        style="position:absolute;top:-30px;left:3px;width:100%;height:272px;z-index:1;opacity:98%;">

    <iframe id="live1"
        scrolling=""
        allowfullscreen
        allow="fullscreen">
    </iframe>

    <!-- One center transparent button -->
    <button id="videoToggle">⏸</button>

    <script src="Live.js"></script>

    <script type="text/javascript">

    const cont = document.getElementById("cont");

    /* دخول Fullscreen عند النقر على الصورة فقط */
    cont.addEventListener("click", function () {
        if (!document.fullscreenElement) {
            cont.style.display = "none";
            document.documentElement.requestFullscreen();
        }
    });

    /* عند الخروج من Fullscreen (ESC فقط) */
    document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement) {
            cont.style.display = "";
            document.body.style.margin = "";
            document.body.style.overflow = "";
        } else {
            document.body.style.margin = "0";
            document.body.style.overflow = "hidden";
        }
    });

    /* Play / Stop Toggle */
    const iframe = document.getElementById("live1");
    const toggleBtn = document.getElementById("videoToggle");

    let originalIframeSrc = "";
    let isPlaying = true;

    setTimeout(() => {
        originalIframeSrc = iframe.src;
    }, 1000);

    toggleBtn.addEventListener("click", () => {

        if (isPlaying) {
            iframe.src = ""; // stop
            toggleBtn.innerHTML = "▶";
        } else {
            iframe.src = originalIframeSrc; // start
            toggleBtn.innerHTML = "⏸";
        }

        isPlaying = !isPlaying;
    });

    </script>

</body>
</html>
