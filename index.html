<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    html, body {
        background-color: #0b141a;
        height: 100%;
        overflow: hidden;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        min-height: 100vh;
        overflow: hidden;
        position: fixed;

    }
    
    body::-webkit-scrollbar {
        display: none;
    }
    
    .container {

        display: flex;

        position: fixed;
        height: 100%;

        right: 0;
        top: 0;
    }
    
    .header {
        z-index: 1000;
        opacity: 99%;
        width: 100%;
        position: fixed;
        background: #1f2c34;
        padding: 8px 16px;
        color: #e9edef;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 1px 2px black;
        top: 0;
    }
    
    .channel-avatar {
        margin-block: -100px;
        width: 50px;
        height: 40px;
        position: relative;
    }
    
    .channel-info {
        flex: 1;
    }
    
    .channel-info h1 {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 1px;
        opacity: 50%;
    }
    
    #subscriberCount {
        opacity: 20%;
    }
    
    .header-icons {
        display: flex;
        gap: 20px;
        color: #8696a0;
        font-size: 20px;
        opacity: 80%;
    }
    
    .header-icons span {
        cursor: pointer;
    }
    
    a {
        text-decoration: none;
        color: #8696a0;
    }
    
    #logo {
        width: 50px;
        height: 50px;
        position: fixed;
        margin-block: -2%;
        border-radius: 200%;
        opacity: 80%;
    }
    
    /* IFRAME STYLES - NO SCROLLING BUT FULLSCREEN ALLOWED */
    iframe {
        background-color: red;
        background-image: url("img/Bein_sport_logo.svg.png");
        background-size: 80%;
        background-repeat: no-repeat;
        background-position: 0.5px 0px;
        width: 95%;
        margin-bottom: 9px;
        box-shadow: 2px 1px 5px 1px black;
        height: 250px;
        z-index: 0;
        overflow: hidden !important;
        display: block;
        border: none;
        position: relative;
    }
    
    /* Hide scrollbars completely */
    iframe::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
    }
    
    /* Firefox scrollbar hiding */
    iframe {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
    }
    
    /* Enable pointer events for interaction but prevent scrolling */
    iframe {
        pointer-events: auto;
    }
    
    #str {
        margin-block: 55px;
        width: 100%;
        z-index: 0;
        max-height: calc(100% - 55px);
        height: auto;
        position: absolute;
        overflow-y: auto;
        background: #0b141a;
        overflow-x: hidden;
        top: 0;
        bottom: 0;
    }
    
    /* Custom scrollbar for #str */
    #str::-webkit-scrollbar {
        width: 3px;
    }
    
    #str::-webkit-scrollbar-track {
        background: #1f2c34;
    }
    
    #str::-webkit-scrollbar-thumb {
        background: #00a884;
        border-radius: 10px;
    }
    
    @media (prefers-color-scheme: dark) {
        meta[name="theme-color"] {
            content: #0b141a;
        }
    }
</style>

<body>

    <script>
        // DISABLE IFRAME SCROLLING BUT KEEP FULLSCREEN
        function disableIframeScrolling() {
            const iframes = document.querySelectorAll('iframe');
            
            iframes.forEach(iframe => {
                // Force no scrolling attribute
                iframe.setAttribute('scrolling', 'no');
                iframe.style.overflow = 'hidden';
                
                // Remove any scroll from iframe content
                iframe.onload = function() {
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc) {
                            // Disable scrolling on body and html
                            iframeDoc.body.style.overflow = 'hidden';
                            iframeDoc.documentElement.style.overflow = 'hidden';
                            iframeDoc.body.style.position = 'relative';
                            iframeDoc.body.style.height = '100%';
                            
                            // Disable scroll events inside iframe
                            iframeDoc.addEventListener('wheel', function(e) {
                                e.preventDefault();
                                e.stopPropagation();
                                return false;
                            }, { passive: false });
                            
                            iframeDoc.addEventListener('touchmove', function(e) {
                                e.preventDefault();
                                e.stopPropagation();
                                return false;
                            }, { passive: false });
                            
                            // Disable keyboard scroll
                            iframeDoc.addEventListener('keydown', function(e) {
                                const scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' ', 'Space', 'Home', 'End'];
                                if (scrollKeys.includes(e.key) || e.keyCode === 32) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    return false;
                                }
                            });
                        }
                    } catch(e) {
                        // Cross-origin iframe - can't modify content, but CSS handles it
                        console.log('Cross-origin iframe (fullscreen still works)');
                    }
                };
                
                // Trigger load if already loaded
                if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                    iframe.onload();
                }
            });
        }
        
        // Run when page loads
        document.addEventListener('DOMContentLoaded', disableIframeScrolling);
        
        // Allow fullscreen button to work
        function allowFullscreen() {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.setAttribute('allowfullscreen', 'true');
                iframe.setAttribute('allow', 'fullscreen; autoplay; encrypted-media');
            });
        }
        
        // Prevent page scroll when using arrow keys
        window.addEventListener('keydown', function(e) {
            const keys = [32, 33, 34, 35, 36, 37, 38, 39, 40];
            if (keys.includes(e.keyCode)) {
                if (!e.target.closest('iframe')) {
                    e.preventDefault();
                }
            }
        });
        
        // Menu function
        function menu() {
            console.log('Menu clicked');
            // Add your menu functionality here
        }
        
        // Optional: Handle fullscreen change events
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                console.log('Entered fullscreen mode');
            } else {
                console.log('Exited fullscreen mode');
            }
        });
    </script>
