<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="google" content="notranslate">
<meta name="theme-color" content="#1f2c34">
<meta name="msapplication-TileColor" content="#3498db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="#1f2c34">
<link rel="icon" type="image/x-icon" href="img/images__1_-removebg-preview.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kora-live</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    html, body {
        background-color:#0b141a;
        overflow: hidden; /* Prevent body scrolling */
        height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        min-height: 100vh;
        overflow: hidden;
        height: 100%;
    }
    
    body::-webkit-scrollbar {display:none;}

    .container {
        max-width: 600px;
        margin: 0 auto;        
        background-color:#0b141a;
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
    }

    .header {
        z-index:1000;
        opacity:99%;
        width:100%;
        position:fixed;
        background: #1f2c34;
        padding: 8px 16px;
        color: #e9edef;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 1px 2px black;
        top: 0;
    }

    .channel-avatar {
        margin-block:-100px;
        width: 50px;
        height: 40px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        position:relative;
    }

    .channel-info {
        flex: 1;
    }

    .channel-info h1 {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 1px;
        opacity:50%;
    }
    
    #subscriberCount {opacity:20%;}

    .header-icons {
        display: flex;
        gap: 20px;
        color: #8696a0;
        font-size: 20px;
        opacity:80%;
    }

    .header-icons span {
        cursor:pointer;
    }

    a {text-decoration:none;}
    
    img:hover {
        /* box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4);*/
    }

    #logo {
        width: 50px;
        height: 50px;
        position: fixed;
        border-radius:200%;
        opacity:80%;
    }
    
    /* Fixed iframe container to prevent scrolling */
    .iframe-wrapper {
        width: 95%;
        margin-bottom: 9px;
        box-shadow: 2px 1px 5px 1px black;
        height: 250px;
        overflow: hidden; /* CRITICAL: Hides iframe scrollbars */
        position: relative;
        background-color: #0b141a;
        background-image: url("img/Bein_sport_logo.svg.png");
        background-size: 80%;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 8px;
    }
    
    .iframe-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        pointer-events: auto; /* Keep iframe clickable */
        position: relative;
        z-index: 1;
    }
    
    /* Hide scrollbars on iframe for WebKit browsers */
    .iframe-wrapper iframe::-webkit-scrollbar {
        display: none;
        width: 0;
    }
    
    #str {
        margin-top: 70px;
        width: 100%;
        height: calc(100% - 70px);
        overflow-y: auto;
        background: #0b141a;
        padding-bottom: 20px;
        position: relative;
    }
    
    /* Hide scrollbar for #str but keep scrolling */
    #str::-webkit-scrollbar {
        width: 4px;
    }
    
    #str::-webkit-scrollbar-track {
        background: #1f2c34;
    }
    
    #str::-webkit-scrollbar-thumb {
        background: #00a884;
        border-radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
        meta[name="theme-color"] {
            content:#0b141a;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header" id="headers">
            <div class="channel-avatar" onclick="menu()">
                <img src="img/images__1_-removebg-preview.png" width="50px" id="logo">
            </div>
            <div class="channel-info">
                <h1>Kora-live</h1>
                <p id="subscriberCount">19.8K</p>
            </div>
            <div class="header-icons">
                <a href="https://wa.me/?text=install kora live by the link : https://kora-live.page.gd/update.html">
                    <span>🔗</span>
                </a>
                <span id="span1">🔔</span>
            </div>
        </div>

        <div id="str" align="center">
            <!-- iframe 1 -->
            <div class="iframe-wrapper">
                <iframe
                    src="https://shinigami-e.github.io/x/stream/live1.html"
                    frameborder="0"
                    allowfullscreen
                    allow="fullscreen"
                    sandbox="allow-scripts allow-same-origin allow-popups">
                </iframe>
            </div>

            <!-- iframe 2 -->
            <div class="iframe-wrapper">
                <iframe
                    src="https://shinigami-e.github.io/x/stream/live2.html"
                    frameborder="0"
                    allowfullscreen
                    allow="fullscreen"
                    sandbox="allow-scripts allow-same-origin allow-popups">
                </iframe>
            </div>
            
            <!-- iframe 3 -->
            <div class="iframe-wrapper">
                <iframe
                    src="https://shinigami-e.github.io/x/stream/live3.html"
                    frameborder="0"
                    allowfullscreen
                    allow="fullscreen"
                    sandbox="allow-scripts allow-same-origin allow-popups">
                </iframe>
            </div>
            
            <!-- iframe 4 -->
            <div class="iframe-wrapper">
                <iframe
                    src="https://shinigami-e.github.io/x/stream/live4.html"
                    frameborder="0"
                    allowfullscreen
                    allow="fullscreen"
                    sandbox="allow-scripts allow-same-origin allow-popups">
                </iframe>
            </div>
        </div>
    </div>   
    
    <script>
        // Additional JavaScript to disable iframe scrolling (for same-origin iframes)
        // This will work if the iframe content is from the same origin
        window.addEventListener('load', function() {
            const iframes = document.querySelectorAll('iframe');
            
            iframes.forEach(iframe => {
                iframe.addEventListener('load', function() {
                    try {
                        // Try to access iframe content (only works for same-origin)
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc) {
                            // Disable scrolling on body and html
                            iframeDoc.body.style.overflow = 'hidden';
                            iframeDoc.documentElement.style.overflow = 'hidden';
                            iframeDoc.body.style.height = '100%';
                            iframeDoc.documentElement.style.height = '100%';
                            
                            // Remove scrollbars
                            const style = iframeDoc.createElement('style');
                            style.textContent = `
                                ::-webkit-scrollbar { display: none; }
                                body { overflow: hidden !important; }
                            `;
                            iframeDoc.head.appendChild(style);
                        }
                    } catch(e) {
                        // Cross-origin iframe - can't modify content, but wrapper prevents visible scrolling
                        console.log('Cross-origin iframe detected');
                    }
                });
            });
        });
    </script>
</body>
</html>
