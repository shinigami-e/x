    /* IFRAME SCROLLING FIX - COMPLETE SOLUTION */
    iframe {
        background-color: red;
        background-image: url("img/Bein_sport_logo.svg.png");
        background-size: 80%;
        background-repeat: no-repeat;
        background-position: 0.5px 0px;
        width: 95%;
        margin-bottom: 9px;
        box-shadow: 2px 1px 5px 1px black;
        height: 250px;
        z-index: 0;
        overflow: hidden !important;
        scrolling: no;
        /* Disable all scrolling */
        position: relative;
        display: block;
    }
    
    /* Hide scrollbars completely */
    iframe::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
    }
    
    /* Firefox scrollbar hiding */
    iframe {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
    }
    
    /* Disable pointer events to prevent any scrolling interaction */
    iframe {
        pointer-events: none;
    }
    
    /* Enable pointer events only for the video area if needed */
    iframe:active {
        pointer-events: auto;
    }
    
    #str {
        margin-block: 55px;

        z-index: 0;
        max-height: 100%;
        height: 92%;
        position: fixed;

    /* Hide scrollbar for #str */

    <script>
        // EXTRA JAVASCRIPT TO ENSURE NO SCROLLING
        function killIframeScrolling() {
            const iframes = document.querySelectorAll('iframe');
            
            iframes.forEach(iframe => {
                // Force attributes
                iframe.setAttribute('scrolling', 'no');
                iframe.style.overflow = 'hidden';
                
                // Remove any potential scroll
                iframe.onload = function() {
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc) {
                            iframeDoc.body.style.overflow = 'hidden';
                            iframeDoc.documentElement.style.overflow = 'hidden';
                            iframeDoc.body.style.position = 'fixed';
                            iframeDoc.body.style.width = '100%';
                            iframeDoc.body.style.height = '100%';
                            
                            // Disable wheel events
                            iframeDoc.addEventListener('wheel', function(e) {
                                e.preventDefault();
                                return false;
                            }, { passive: false });
                            
                            // Disable touch events
                            iframeDoc.addEventListener('touchmove', function(e) {
                                e.preventDefault();
                                return false;
                            }, { passive: false });
                            
                            // Disable keyboard scroll
                            iframeDoc.addEventListener('keydown', function(e) {
                                const scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' ', 'Space', 'Home', 'End'];
                                if (scrollKeys.includes(e.key) || e.keyCode === 32) {
                                    e.preventDefault();
                                    return false;
                                }
                            });
                        }
                    } catch(e) {
                        // Cross-origin iframe - already handled by CSS
                        console.log('Cross-origin iframe detected');
                    }
                };
            });
        }
        
        // Run on page load
        document.addEventListener('DOMContentLoaded', killIframeScrolling);
        
        // Disable entire page scrolling via wheel
        document.body.addEventListener('wheel', function(e) {
            // Allow scrolling only on the #str container
            if (e.target.closest('#str')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
        
        // Disable touchmove on non-scrollable areas
        document.body.addEventListener('touchmove', function(e) {
            if (e.target.closest('#str')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
        
        // Additional function for menu
        function menu() {
            // Your menu function here
            console.log('Menu clicked');
        }
    </script>
